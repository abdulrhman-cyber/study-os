<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study OS</title>
<script>
  /* GitHub Pages SPA fallback:
     التطبيق يستخدم روابط hash (#/route)، لذا لا يحتاج أي طلب مسار حقيقي.
     لو كتب المستخدم رابطًا بمسار حقيقي مثل /repo/todo، نعيده إلى /repo/#/todo
     فيعمل بدون 404 مع الحفاظ على شكل الرابط. */
  (function () {
    var path = location.pathname.replace(/\/+$/, "");
    var parts = path.split("/");
    var last = parts.pop();
    var base = parts.join("/") + "/";
    if (!last || last === "index.html" || last === "404.html") {
      location.replace(base);
      return;
    }
    location.replace(base + "#/" + last + location.search);
  })();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#888">جارٍ تحويلك…</p>
</body>
</html>
