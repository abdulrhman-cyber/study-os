<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1013">
<title>Study OS — نظام تشغيل دراستك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/adaptive.css">
<link rel="icon" type="image/x-icon" href="img/logo.ico">
<link rel="icon" type="image/png" sizes="64x64" href="img/logo.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study OS">
</head>
<body>

<a class="skip-link" href="#view-root">تخطي إلى المحتوى</a>

<!-- ═══ BACKGROUND DEPTH ═══ -->
<div class="bg" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="aurora a4"></div>
  <div class="noise"></div>
</div>

<!-- ═══ APP SHELL ═══ -->
<input type="checkbox" id="side-drawer" class="visually-hidden" aria-hidden="true">
<div id="scrim" class="scrim" aria-hidden="true"></div>

<div class="app" id="app" style="opacity:0">
  <aside class="sidebar" id="sidebar">
    <div class="side-glow" aria-hidden="true"></div>
    <div class="side-top">
      <a class="brand" href="#/ai-assistant" aria-label="Study OS — الصفحة الرئيسية">
        <span class="mark" aria-hidden="true">
          <img class="brand-logo" src="img/logo.png" alt="" width="42" height="42">
        </span>
        <span class="brand-txt">
          <b>Study <em>OS</em></b>
          <small><span class="live-dot" aria-hidden="true"></span>جاهز للدراسة</small>
        </span>
      </a>
      <button class="icon-btn collapse-btn" id="side-collapse" title="طي القائمة" aria-label="طي القائمة" data-tooltip="طي القائمة">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v18h-6M10 17 5 12l5-5M5 12h11"/></svg>
      </button>
    </div>

    <div class="side-goal glass-2" id="sidebar-goal"></div>

    <nav class="nav" id="side-nav" aria-label="التنقل الرئيسي"></nav>

    <div class="side-foot">
      <div class="side-user" id="side-user" data-route="profile" tabindex="0" role="button">
        <div class="avatar" id="side-avatar"></div>
        <div class="side-user-txt">
          <div class="side-user-name" id="side-user-name">طالب</div>
          <div class="side-user-grade" id="side-user-grade">ثانية ثانوي — بكالوريا</div>
        </div>
      </div>
      <a class="side-settings" data-route="settings" href="#/settings">
        <span class="ni"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span>
        <span class="side-nav-label">الإعدادات</span>
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar glass-1">
      <div class="tb-start">
        <button class="icon-btn menu-btn" id="tb-menu" aria-label="القائمة" title="القائمة">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="tb-title" id="tb-title">لوحة التحكم</div>
      </div>
      <button class="tb-search" id="tb-search" title="بحث سريع (Ctrl+K)" aria-label="بحث سريع">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="txt">ابحث عن صفحة، مهمة، واجب، ملاحظة، خطأ…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="tb-actions">
        <span class="tb-pill" id="tb-streak" data-tooltip="عدد أيام السلسلة المتتالية">—</span>
        <span class="tb-pill accent" id="tb-xp" data-tooltip="نقاط الخبرة">—</span>
        <button class="icon-btn" id="tb-quick-add" title="إضافة سريعة" aria-label="إضافة سريعة">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn rel" id="tb-bell" title="التنبيهات" aria-label="التنبيهات">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="badge-dot" id="tb-bell-badge" hidden>0</span>
        </button>
        <button class="icon-btn" id="tb-theme" title="المظهر" aria-label="تبديل المظهر"></button>
        <button class="avatar mini" id="tb-avatar" data-route="profile" aria-label="الملف الشخصي"></button>
      </div>
    </header>

    <main class="content">
      <div id="view-root" class="view" data-view="">
        <div class="skeleton-stack" id="boot-skeleton" aria-hidden="true">
          <div class="sk hero"></div>
          <div class="sk grid">
            <div class="sk card"></div><div class="sk card"></div><div class="sk card"></div><div class="sk card"></div>
          </div>
          <div class="sk card tall"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ═══ FAB ═══ -->
<div class="fab-wrap" id="fab-wrap">
  <div class="fab-menu" id="fab-menu" hidden>
    <button class="fab-item" data-fab="task"><span class="fab-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 3 5M21 3l-6.5 18a.55.55 0 0 1-1 0L10 14l-7-3.5a.55.55 0 0 1 0-1L21 3Z"/></svg></span>إضافة مهمة</button>
    <button class="fab-item" data-fab="homework"><span class="fab-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg></span>إضافة واجب</button>
    <button class="fab-item" data-fab="note"><span class="fab-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5Z"/><path d="M15 3v6h6"/></svg></span>إضافة ملاحظة</button>
    <button class="fab-item" data-fab="session"><span class="fab-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9Z"/></svg></span>بدء جلسة</button>
  </div>
  <button class="fab" id="fab-btn" aria-label="إضافة سريعة" title="إضافة سريعة">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- ═══ MODAL / TOAST / POPUP ROOTS ═══ -->
<div id="modal-root" class="modal-root" aria-live="polite"></div>
<div id="toast-root" class="toast-root" aria-live="assertive"></div>
<div id="popup-root" class="popup-root"></div>
<div id="float-root" class="float-root" aria-hidden="true"></div>

<!-- ═══ FOCUS THEATRE ═══ -->
<div id="theatre" class="theatre" hidden aria-hidden="true">
  <div class="theatre-aurora" aria-hidden="true"></div>
  <div class="theatre-body">
    <div class="theatre-top">
      <span class="theatre-tag">Focus <em>Theatre</em></span>
      <button class="icon-btn plain" id="theatre-exit" aria-label="الخروج من الوضع المركز">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        خروج
      </button>
    </div>
    <div class="theatre-main">
      <div class="theatre-ring-holder">
        <div class="theatre-ring" id="theatre-ring"></div>
      </div>
      <div class="theatre-side">
        <div class="theatre-subject" id="theatre-subject">البرمجة</div>
        <div class="theatre-quote" id="theatre-quote">دقيقة. جلسة واحدة فقط.</div>
        <div class="theatre-three" id="theatre-three">
          <div class="th-seg">
            <div class="th-seg-label">الجولات</div>
            <div class="th-seg-val" id="th-pomo">0</div>
          </div>
          <div class="th-seg">
            <div class="th-seg-label">المدة</div>
            <div class="th-seg-val" id="th-total">00:00</div>
          </div>
          <div class="th-seg">
            <div class="th-seg-label">النسبة</div>
            <div class="th-seg-val" id="th-pct">0%</div>
          </div>
        </div>
        <div class="theatre-bar"><i id="theatre-bar-fill"></i></div>
      </div>
    </div>
    <div class="theatre-controls">
      <button class="btn glass" id="theatre-pause">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        <span id="theatre-pause-txt">إيقاف مؤقت</span>
      </button>
      <button class="btn primary" id="theatre-finish">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        إنهاء الجلسة
      </button>
    </div>
  </div>
</div>

<script defer src="js/util.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/timer.js"></script>
<script defer src="js/views-core.js"></script>
<script defer src="js/views-data.js"></script>
<script defer src="js/views-meta.js"></script>
<script defer src="js/modals.js"></script>
<script defer src="js/notify.js"></script>
<script defer src="js/push.js"></script>
<script defer src="js/supabase-config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/supabase.js"></script>
<script defer src="js/ai-assistant.js"></script>
<script defer src="js/views-summaries.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
